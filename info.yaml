documentation: 
  author:       "Alice Tang"      # Your name
  discord:      ""      # Your discord handle
  title:        "Tetris"      # Project title
  description:  "A condensed version of Tetris with no speedup or fancy mechanics (e.g. t-spin). "      # Short description of what your project does
  how_it_works: "The main strategy of this design is to use the fact that the VGA cycle is really long to allow for game state to be updated over multiple clock cycles instead of one. More details can be found in the documentation folder."      # Longer description of how the project works
  how_to_test:  "Attach a 640x480 VGA monitor to the tinyVGA Pmod which hooks up to ports io_out[7:0], 4 buttons to io_in[3:0], an SPI joystick to io_in[4] + io_out[10:8], an LED to io_out[11], and run a 25MHz clock."      # Instructions on how someone could test your project, include things like what buttons do what and how to set the clock if needed
  external_hw:  "A 640x480@60Hz VGA monitor, the tinyVGA Pmod, the Pmod JSTK2, and 4 buttons plus an LED."      # Describe any external hardware needed
